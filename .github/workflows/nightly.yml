name: Nightly tests

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST_PORT: "8000"
      MODEL_DIR: ${{ github.workspace }}/.tmp/simpleword-e2e-models
      IMAGE: simple-word:e2e
      PROXY_IMAGE: simple-word-proxy:e2e
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_NO_SERVER: "1"
      MAX_CONCURRENT_SIMPLIFY: "100"
      NGINX_SIMPLIFY_RATE: "1000r/s"
      NGINX_SIMPLIFY_BURST: "1000"
      NGINX_FEEDBACK_RATE: "1000r/s"
      NGINX_FEEDBACK_BURST: "1000"
      NGINX_CONNECTIONS_PER_IP: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start isolated compose service
        env:
          PROJECT: simpleword-e2e-${{ github.run_id }}
        run: |
          mkdir -p "$MODEL_DIR"
          docker compose -p "$PROJECT" -f deploy/compose.yaml up -d --build --wait --wait-timeout 180 api-1 api-2 proxy
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated compose service
        if: always()
        env:
          PROJECT: simpleword-e2e-${{ github.run_id }}
        run: docker compose -p "$PROJECT" -f deploy/compose.yaml down -v --remove-orphans

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_CONCURRENT_SIMPLIFY: "2"
      LOAD_REQUESTS: "30"
      LOAD_MAX_P95_MS: "5000"
      BURST_REQUESTS: "30"
      BURST_CONCURRENCY: "10"
      BURST_MIN_429_RATE: "0.01"
      NGINX_SIMPLIFY_RATE: "1000r/s"
      NGINX_SIMPLIFY_BURST: "1000"
      NGINX_FEEDBACK_RATE: "1000r/s"
      NGINX_FEEDBACK_BURST: "1000"
      NGINX_CONNECTIONS_PER_IP: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python scripts/integration.py
      - name: Start service for load check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          run_dir="$(mktemp -d "$GITHUB_WORKSPACE/.tmp/nightly.XXXXXX")"
          project="simpleword-nightly-${GITHUB_RUN_ID}"
          export MODEL_DIR="$run_dir/models" HOST_PORT=18016
          mkdir -p "$MODEL_DIR"
          cleanup() {
            docker compose -p "$project" -f deploy/compose.yaml down -v --remove-orphans || true
            rm -rf "$run_dir"
          }
          trap cleanup EXIT
          docker compose -p "$project" -f deploy/compose.yaml up -d --build --wait --wait-timeout 180 api-1 api-2 proxy
          python scripts/smoke.py http://127.0.0.1:18016
          python scripts/load.py --url http://127.0.0.1:18016/simplify --requests "$LOAD_REQUESTS" --concurrency "$MAX_CONCURRENT_SIMPLIFY" --max-p95-ms "$LOAD_MAX_P95_MS" --max-429-rate 0
          python scripts/load.py --url http://127.0.0.1:18016/simplify --requests "$BURST_REQUESTS" --concurrency "$BURST_CONCURRENCY" --min-429-rate "$BURST_MIN_429_RATE"
  rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify production IP rate limit returns 429
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/nightly-rate/models
          project="simpleword-rate-${GITHUB_RUN_ID}"
          export HOST_PORT=18017 MODEL_DIR="$GITHUB_WORKSPACE/.tmp/nightly-rate/models" MAX_CONCURRENT_SIMPLIFY=100
          compose=(docker compose -p "$project" -f deploy/compose.yaml)
          cleanup() {
            "${compose[@]}" down -v --remove-orphans || true
            rm -rf .tmp/nightly-rate
          }
          trap cleanup EXIT
          "${compose[@]}" up -d --build --wait --wait-timeout 180 api-1 api-2 proxy
          python scripts/load.py --url http://127.0.0.1:18017/simplify --requests 20 --concurrency 10 --min-429-rate 0.1
          printf '간단한 요청입니다.\n' > .tmp/nightly-rate/request.txt
          status="$(curl --silent --show-error -D .tmp/nightly-rate/headers -o .tmp/nightly-rate/body -w '%{http_code}' -F 'file=@.tmp/nightly-rate/request.txt;type=text/plain' http://127.0.0.1:18017/simplify)"
          test "$status" = 429
          python -c "import json,pathlib; headers=pathlib.Path('.tmp/nightly-rate/headers').read_text().lower(); body=json.loads(pathlib.Path('.tmp/nightly-rate/body').read_text()); assert 'retry-after: 1' in headers and body.get('detail')"

  rolling-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Verify rolling replacement and rollback
        run: bash deploy/test-local.sh
