name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t simple-word:ci .
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:coverage
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --cov=api --cov-report=term-missing --cov-fail-under=80
      - run: python -m pytest -q --cov=simple_word --cov-report=term-missing --cov-fail-under=80
      - run: python -m pytest -q --cov=gate --cov-report=term-missing --cov-fail-under=80
      - run: python -m pytest -q --cov=training.checks --cov=training.preprocess --cov=training.terms --cov=training.eval_set --cov=training.stats --cov=training.pipeline --cov-report=term-missing
