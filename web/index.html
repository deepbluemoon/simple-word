<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>쉬운 말로 바꾸기</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header>
        <h1>쉬운 말로 바꾸기</h1>
        <p class="intro">공문서 파일을 올리면 문장마다 쉬운 말로 바꿔 보여 드립니다.</p>
      </header>

      <form id="upload-form" novalidate>
        <label id="drop-zone" class="drop-zone" for="file">
          <span class="drop-icon" aria-hidden="true">📄</span>
          <span class="drop-title">파일을 여기에 끌어다 놓거나 <u>눌러서 고르세요</u></span>
          <span class="drop-hint" id="file-hint">.txt · .docx · .hwpx · .pdf 파일, 5MB까지</span>
          <input id="file" name="file" type="file" accept=".txt,.docx,.hwpx,.pdf" aria-describedby="file-hint">
        </label>
        <p id="file-info" class="file-info" hidden>
          <span class="file-name" id="file-name"></span>
          <span class="file-size" id="file-size"></span>
        </p>
        <button id="submit" class="primary-button" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="button-label">쉽게 바꾸기</span>
        </button>
        <div id="progress" class="progress" hidden>
          <progress aria-label="처리 중"></progress>
          <span id="progress-text">문서를 읽고 쉬운 말로 바꾸고 있습니다…</span>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <div class="results-head">
          <h2 id="results-title" tabindex="-1">바꾼 결과</h2>
          <p id="summary" class="summary"></p>
        </div>
        <div class="toolbar">
          <div class="tabs" role="group" aria-label="보기 방식">
            <button type="button" data-view="both" aria-pressed="true">나란히 보기</button>
            <button type="button" data-view="simple" aria-pressed="false">쉬운 말만</button>
          </div>
          <div class="actions">
            <button id="copy" type="button" class="secondary-button">쉬운 말 전체 복사</button>
            <button id="download" type="button" class="secondary-button">.txt로 내려받기</button>
          </div>
        </div>
        <p class="keep-note"><span class="badge">원문 유지</span> 표시는 숫자·날짜·금액이나 법령·제도 이름이 바뀔 위험이 있어 원문을 그대로 둔 문장입니다.</p>
        <ol id="sentences" class="sentences" data-view="both"></ol>
      </section>
    </main>
    <script src="/core.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
