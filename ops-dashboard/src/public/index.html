<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AWS와 GCP 운영 상태 및 월 비용">
    <title>Ops Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/dashboard.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="대시보드 메뉴">
        <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">O</span><span><b>Ops</b><small>CLOUD DASHBOARD</small></span></div>
        <div class="sidebar-section-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="화면 선택">
          <a class="nav-item active" href="#clouds" data-tab="clouds" aria-current="page"><span class="nav-icon" aria-hidden="true">◫</span>클라우드 상태</a>
          <a class="nav-item" href="#costs" data-tab="costs"><span class="nav-icon" aria-hidden="true">＄</span>월 비용</a>
        </nav>
        <div class="sidebar-bottom"><p class="sidebar-note">이 Mac에서만 수신 · 30초마다 갱신</p></div>
      </aside>
      <div class="app-main">
        <header class="topbar">
          <div class="breadcrumb"><span>OPS</span><span class="breadcrumb-divider">/</span><strong id="page-title">클라우드 상태</strong></div>
          <div class="top-actions"><span class="updated-label">갱신 <time id="updated-at">--:--:--</time></span><button id="refresh" class="refresh-button" type="button">↻ 갱신</button></div>
        </header>
        <main class="content-shell">
          <section id="clouds-view" class="view" aria-labelledby="clouds-title">
            <div class="view-heading"><div><p class="eyebrow">INFRASTRUCTURE</p><h1 id="clouds-title">클라우드 상태</h1><p class="view-description">AWS는 SSH Docker 조회, GCP는 Cloud Run과 Cloud Monitoring 데이터를 표시합니다.</p></div></div>
            <div id="cloud-grid" class="cloud-grid" aria-live="polite"><p class="panel">연결 상태를 확인하고 있습니다.</p></div>
          </section>
          <section id="costs-view" class="view" aria-labelledby="costs-title" hidden>
            <div class="view-heading"><div><p class="eyebrow">MONTHLY COST</p><h1 id="costs-title">월 비용</h1><p id="cost-note" class="view-description">공시 단가를 사용한 예상 비용입니다.</p></div></div>
            <div id="cost-grid" class="cloud-grid" aria-live="polite"><p class="panel">비용을 불러오는 중입니다.</p></div>
          </section>
          <p id="status" role="status" aria-live="polite" class="sr-only"></p>
        </main>
      </div>
    </div>
  </body>
</html>
