services:
  api-1:
    volumes:
      - /srv/simple-word/models:/app/models:ro
      - /srv/simple-word/logs:/app/logs
  api-2:
    volumes:
      - /srv/simple-word/models:/app/models:ro
      - /srv/simple-word/logs:/app/logs
  proxy:
    ports:
      - "443:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-moon.eta.pyhub.kr}
      NGINX_HTTPS_REDIRECT: ${NGINX_HTTPS_REDIRECT:-on}
      NGINX_TLS_FULLCHAIN: ${NGINX_TLS_FULLCHAIN:-/etc/letsencrypt/live/moon.eta.pyhub.kr/fullchain.pem}
      NGINX_TLS_PRIVKEY: ${NGINX_TLS_PRIVKEY:-/etc/letsencrypt/live/moon.eta.pyhub.kr/privkey.pem}
    volumes:
      - ./nginx-tls.conf.template:/etc/nginx/templates/tls.conf.template:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
