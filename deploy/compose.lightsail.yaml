services:
  api-1:
    volumes:
      - /srv/simple-word/models:/app/models:ro
      - /srv/simple-word/logs:/app/logs
  api-2:
    volumes:
      - /srv/simple-word/models:/app/models:ro
      - /srv/simple-word/logs:/app/logs
  proxy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_SERVER_NAME: ${SIMPLE_WORD_DOMAIN:?set SIMPLE_WORD_DOMAIN}
      NGINX_HTTPS_REDIRECT: ${NGINX_HTTPS_REDIRECT:-on}
    volumes:
      - ./nginx-tls.conf.template:/etc/nginx/templates/tls.conf.template:ro
      - /etc/letsencrypt/live/${SIMPLE_WORD_DOMAIN:?set SIMPLE_WORD_DOMAIN}:/etc/letsencrypt/live/${SIMPLE_WORD_DOMAIN}:ro
      - /etc/letsencrypt/archive/${SIMPLE_WORD_DOMAIN}:/etc/letsencrypt/archive/${SIMPLE_WORD_DOMAIN}:ro
      - /srv/simple-word/certbot:/var/www/certbot:ro
