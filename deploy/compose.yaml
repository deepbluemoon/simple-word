services:
  api-1:
    image: ${IMAGE:-simple-word:local}
    build:
      context: ..
      dockerfile: Dockerfile
    expose: ["8000"]
    volumes:
      - ${MODEL_DIR:-../models}:/app/models:ro
      - logs:/app/logs
    environment:
      LOG_DIR: /app/logs
      MAX_CONCURRENT_SIMPLIFY: ${MAX_CONCURRENT_SIMPLIFY:-2}
    healthcheck: &api_healthcheck
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  api-2:
    image: ${IMAGE:-simple-word:local}
    build:
      context: ..
      dockerfile: Dockerfile
    expose: ["8000"]
    volumes:
      - ${MODEL_DIR:-../models}:/app/models:ro
      - logs:/app/logs
    environment:
      LOG_DIR: /app/logs
      MAX_CONCURRENT_SIMPLIFY: ${MAX_CONCURRENT_SIMPLIFY:-2}
    healthcheck: *api_healthcheck

  proxy:
    image: ${PROXY_IMAGE:-simple-word-proxy:local}
    build:
      context: ..
      dockerfile: deploy/proxy.Dockerfile
    ports:
      - "${HOST_PORT:-8000}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      NGINX_HTTPS_REDIRECT: ${NGINX_HTTPS_REDIRECT:-off}
      NGINX_SIMPLIFY_RATE: ${NGINX_SIMPLIFY_RATE:-10r/m}
      NGINX_SIMPLIFY_BURST: ${NGINX_SIMPLIFY_BURST:-5}
      NGINX_FEEDBACK_RATE: ${NGINX_FEEDBACK_RATE:-30r/m}
      NGINX_FEEDBACK_BURST: ${NGINX_FEEDBACK_BURST:-10}
      NGINX_CONNECTIONS_PER_IP: ${NGINX_CONNECTIONS_PER_IP:-20}
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$NGINX_HTTPS_REDIRECT\" = on ]; then wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health; else wget -q -O /dev/null http://127.0.0.1/health; fi"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  logs:
