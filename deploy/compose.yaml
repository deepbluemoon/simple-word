services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ${MODEL_DIR:-../models}:/app/models:ro
      - logs:/app/logs
    environment:
      LOG_DIR: /app/logs
      MAX_CONCURRENT_SIMPLIFY: ${MAX_CONCURRENT_SIMPLIFY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  logs:
