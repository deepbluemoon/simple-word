[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-word"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "defusedxml",
    "numpy",
    "onnxruntime",
    "tokenizers",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "httpx"]
train = ["torch", "transformers", "onnx", "bert-score"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "training/train.py", # Torch training loop and checkpointing
    "training/export.py", # Torch/ONNX conversion
    "training/teacher.py", # Ollama network calls
]

[tool.setuptools]
packages = ["simple_word", "api", "gate", "training"]

[tool.setuptools.package-data]
simple_word = ["*.txt"]
